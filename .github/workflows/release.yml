name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      PACK_DIR: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match "^v(.+)$") {
              $ver = $matches[1]
          } else {
              $ver = $tag
          }
          Write-Host "VERSION=$ver"
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT

      - name: Ensure Inno Setup (ISCC.exe)
        shell: pwsh
        run: |
          # Try known paths first
          $paths = @(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          foreach ($p in $paths) {
              if (Test-Path $p) {
                  Write-Host "ISCC found at $p"
                  exit 0
              }
          }

          Write-Host "Inno Setup not found, installing via Chocolatey..."
          choco install innosetup -y --no-progress
          
          # Refresh path for the current process
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path", "User")
          
          # Re-check
          foreach ($p in $paths) {
              if (Test-Path $p) {
                  Write-Host "ISCC found at $p after install"
                  exit 0
              }
          }
          
          # Try to find it in Path
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($iscc) {
              Write-Host "ISCC found in PATH: $($iscc.Source)"
              exit 0
          }

          Write-Error "ISCC.exe not found even after install"
          exit 1

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
              $paths = @(
                  "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
                  "C:\Program Files\Inno Setup 6\ISCC.exe"
              )
              foreach ($p in $paths) { if (Test-Path $p) { $iscc = $p; break } }
          } else {
              $iscc = $iscc.Source
          }
          
          if (-not $iscc) { Write-Error "ISCC.exe not found"; exit 1 }

          $issFile = Join-Path $env:PACK_DIR "installer\FreeLLMAPI-Launcher.iss"
          $outputDir = Join-Path $env:PACK_DIR "installer\output"
          $ver = "${{ steps.version.outputs.VERSION }}"
          
          $args = @(
              "/DMyAppVersion=$ver",
              "/DPackDir=$env:PACK_DIR",
              "/o$outputDir",
              $issFile
          )
          
          Write-Host "Running: $iscc $args"
          & $iscc $args
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Find built installer
        id: artifact
        shell: pwsh
        run: |
          $outputDir = Join-Path $env:PACK_DIR "installer\output"
          $exe = Get-ChildItem $outputDir -Filter "*.exe" -File | Select-Object -First 1
          if (-not $exe) { Write-Error "No .exe found in $outputDir"; exit 1 }
          Write-Host "EXE_PATH=$($exe.FullName)"
          echo "EXE_PATH=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          echo "EXE_NAME=$($exe.Name)" >> $env:GITHUB_OUTPUT

      - name: Create zip archive (without .github and .git)
        id: zip
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          $zipName = "freellmapi-launcher-pack-v$ver.zip"
          $zipPath = Join-Path $env:PACK_DIR $zipName
          $exclude = @(".github", ".git")
          $items = Get-ChildItem -Path $env:PACK_DIR -Force | Where-Object { $_.Name -notin $exclude }
          $items | Compress-Archive -DestinationPath $zipPath -Force -CompressionLevel Optimal
          Write-Host "ZIP_PATH=$zipPath"
          echo "ZIP_PATH=$zipPath" >> $env:GITHUB_OUTPUT
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_OUTPUT

      - name: Generate checksums
        id: checksums
        shell: pwsh
        run: |
          $exe = "${{ steps.artifact.outputs.EXE_PATH }}"
          $zip = "${{ steps.zip.outputs.ZIP_PATH }}"
          $sums = @()
          if (Test-Path $exe) {
              $h = Get-FileHash -Algorithm SHA256 $exe
              $sums += "$($h.Hash)  $(Split-Path $exe -Leaf)"
          }
          if (Test-Path $zip) {
              $h = Get-FileHash -Algorithm SHA256 $zip
              $sums += "$($h.Hash)  $(Split-Path $zip -Leaf)"
          }
          $checksumsFile = Join-Path $env:PACK_DIR "checksums.txt"
          Set-Content -Path $checksumsFile -Value ($sums -join "`r`n") -Encoding utf8
          Write-Host "CHECKSUMS_PATH=$checksumsFile"
          echo "CHECKSUMS_PATH=$checksumsFile" >> $env:GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FreeLLMAPI Launcher ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.artifact.outputs.EXE_PATH }}
            ${{ steps.zip.outputs.ZIP_PATH }}
            ${{ steps.checksums.outputs.CHECKSUMS_PATH }}